<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    App icon for The Orrery — used by the PWA manifest, favicon and
    (via export) the Android launcher. Key art stays inside the center
    ~60% so adaptive/maskable crops never touch it.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#0b1428"/>
      <stop offset="62%" stop-color="#0a1122"/>
      <stop offset="100%" stop-color="#060a16"/>
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#ffc84d"/>
      <stop offset="100%" stop-color="#f08a1e"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background (maskable icons crop this, never the art) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sparse star specks -->
  <g fill="#e8f0ff">
    <circle cx="96" cy="118" r="3" opacity="0.55"/>
    <circle cx="424" cy="86" r="2.4" opacity="0.4"/>
    <circle cx="452" cy="392" r="3" opacity="0.5"/>
    <circle cx="72" cy="396" r="2.2" opacity="0.4"/>
    <circle cx="360" cy="452" r="2" opacity="0.35"/>
    <circle cx="150" cy="60" r="2" opacity="0.35"/>
  </g>

  <!-- sun glow halos -->
  <circle cx="256" cy="256" r="86" fill="#ff8a1e" opacity="0.10"/>
  <circle cx="256" cy="256" r="60" fill="#ffab2e" opacity="0.22"/>

  <!-- orbits (three ellipses at 0° / 60° / 120°, like the header mark) -->
  <g fill="none" stroke="#a9bfe4" stroke-width="3.5" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="150" ry="60" opacity="0.55"/>
    <ellipse cx="256" cy="256" rx="150" ry="60" transform="rotate(60 256 256)" opacity="0.38"/>
    <ellipse cx="256" cy="256" rx="150" ry="60" transform="rotate(120 256 256)" opacity="0.26"/>
  </g>

  <!-- sun -->
  <circle cx="256" cy="256" r="34" fill="url(#sun)"/>

  <!-- planets riding their orbits -->
  <circle cx="115" cy="236" r="11" fill="#7fd0d4"/>
  <g transform="rotate(60 256 256)">
    <circle cx="386" cy="286" r="9" fill="#d4694a"/>
  </g>
  <g transform="rotate(120 256 256)">
    <circle cx="152" cy="292" r="6" fill="#e6c07a"/>
  </g>
</svg>
